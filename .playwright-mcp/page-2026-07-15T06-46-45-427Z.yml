        - heading [level=3] [ref=e1480]:
          - link "Using @apply with Vue, Svelte, or CSS modules" [ref=e1481] [cursor=pointer]:
            - /url: "#using-apply-with-vue-svelte-or-css-modules"
        - paragraph [ref=e1482]:
          - text: In v4, stylesheets that are bundled separately from your main CSS file (e.g. CSS modules files,
          - code [ref=e1483]: "`<style>`"
          - text: blocks in Vue, Svelte, or Astro, etc.) do not have access to theme variables, custom utilities, and custom variants defined in other files.
        - paragraph [ref=e1484]:
          - text: To make these definitions available in these contexts, use
          - link [ref=e1485] [cursor=pointer]:
            - /url: /docs/functions-and-directives#reference-directive
            - code [ref=e1486]: "`@reference`"
          - text: "to import them without duplicating any CSS in your bundle:"
        - generic [ref=e1489]:
          - generic [ref=e1490]: Vue
          - code [ref=e1494]:
            - generic [ref=e1495]: <template>
            - generic [ref=e1496]: <h1>Hello world!</h1>
            - generic [ref=e1497]: </template>
            - generic [ref=e1499]: <style>
            - generic [ref=e1500]: "@reference \"../../app.css\";"
