            - generic [ref=e1431]: "}"
        - heading [level=3] [ref=e1432]:
          - link "Using a JavaScript config file" [ref=e1433] [cursor=pointer]:
            - /url: "#using-a-javascript-config-file"
        - paragraph [ref=e1434]: JavaScript config files are still supported for backward compatibility, but they are no longer detected automatically in v4.
        - paragraph [ref=e1435]:
          - text: If you still need to use a JavaScript config file, you can load it explicitly using the
          - code [ref=e1436]: "`@config`"
          - text: "directive:"
        - generic [ref=e1439]:
          - generic [ref=e1440]: CSS
          - code [ref=e1444]:
            - generic [ref=e1445]: "@config \"../../tailwind.config.js\";"
        - paragraph [ref=e1446]:
          - text: The
          - code [ref=e1447]: "`corePlugins`"
          - text: ","
          - code [ref=e1448]: "`safelist`"
          - text: ", and"
          - code [ref=e1449]: "`separator`"
          - text: options from the JavaScript-based config are not supported in v4.0. To safelist utilities in v4 use
          - link [ref=e1450] [cursor=pointer]:
