    - generic [ref=e549]:
      - paragraph [ref=e550]: Getting started
      - heading "Upgrade guide" [level=1] [ref=e551]
      - paragraph [ref=e552]: Upgrading your Tailwind CSS projects from v3 to v4.
      - generic [ref=e553]:
        - paragraph [ref=e554]: Tailwind CSS v4.0 is a new major version of the framework, so while we've worked really hard to minimize breaking changes, some updates are necessary. This guide outlines all the steps required to upgrade your projects from v3 to v4.
        - paragraph [ref=e555]:
          - strong [ref=e556]: Tailwind CSS v4.0 is designed for Safari 16.4+, Chrome 111+, and Firefox 128+.
          - text: If you need to support older browsers, stick with v3.4 until your browser support requirements change.
        - heading [level=2] [ref=e557]:
          - link "Using the upgrade tool" [ref=e558] [cursor=pointer]:
            - /url: "#using-the-upgrade-tool"
        - paragraph [ref=e559]: "If you'd like to upgrade a project from v3 to v4, you can use our upgrade tool to do the vast majority of the heavy lifting for you:"
        - generic [ref=e562]:
          - generic [ref=e563]: Terminal
          - code [ref=e567]:
            - generic [ref=e568]: $ npx @tailwindcss/upgrade
        - paragraph [ref=e569]: For most projects, the upgrade tool will automate the entire migration process including updating your dependencies, migrating your configuration file to CSS, and handling any changes to your template files.
        - paragraph [ref=e570]: The upgrade tool requires Node.js 20 or higher, so ensure your environment is updated before running it.
        - paragraph [ref=e571]:
          - strong [ref=e572]: We recommend running the upgrade tool in a new branch
          - text: ", then carefully reviewing the diff and testing your project in the browser to make sure all of the changes look correct. You may need to tweak a few things by hand in complex projects, but the tool will save you a ton of time either way."
        - paragraph [ref=e573]:
          - text: It's also a good idea to go over all of the
          - link "breaking changes" [ref=e574] [cursor=pointer]:
            - /url: "#changes-from-v3"
          - text: in v4 and get a good understanding of what's changed, in case there are other things you need to update in your project that the upgrade tool doesn't catch.
        - heading [level=2] [ref=e575]:
          - link "Upgrading manually" [ref=e576] [cursor=pointer]:
            - /url: "#upgrading-manually"
        - heading [level=3] [ref=e577]:
          - link "Using PostCSS" [ref=e578] [cursor=pointer]:
            - /url: "#using-postcss"
        - paragraph [ref=e579]:
          - text: In v3, the
          - code [ref=e580]: "`tailwindcss`"
          - text: package was a PostCSS plugin, but in v4 the PostCSS plugin lives in a dedicated
          - code [ref=e581]: "`@tailwindcss/postcss`"
          - text: package.
        - paragraph [ref=e582]:
          - text: Additionally, in v4 imports and vendor prefixing is now handled for you automatically, so you can remove
          - code [ref=e583]: "`postcss-import`"
          - text: and
          - code [ref=e584]: "`autoprefixer`"
          - text: "if they are in your project:"
