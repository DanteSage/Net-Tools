            - generic [ref=e1523]: "}"
            - generic [ref=e1524]: </style>
        - paragraph [ref=e1525]:
          - text: You can find more documentation on
          - link "using Tailwind with CSS modules" [ref=e1526] [cursor=pointer]:
            - /url: /docs/compatibility#css-modules
          - text: .
        - heading [level=3] [ref=e1527]:
          - link "Using Sass, Less, and Stylus" [ref=e1528] [cursor=pointer]:
            - /url: "#using-sass-less-and-stylus"
        - paragraph [ref=e1529]:
          - text: Tailwind CSS v4.0 is not designed to be used with CSS preprocessors like Sass, Less, or Stylus. Think of Tailwind CSS itself as your preprocessor — you shouldn't use Tailwind with Sass for the same reason you wouldn't use Sass with Stylus. Because of this it is not possible to use Sass, Less, or Stylus for your stylesheets or
          - code [ref=e1530]: "`<style>`"
