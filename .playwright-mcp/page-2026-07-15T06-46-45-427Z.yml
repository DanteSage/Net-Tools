            - /url: "#individual-transform-properties"
        - paragraph [ref=e1359]:
          - text: The
          - code [ref=e1360]: "`rotate-*`"
          - text: ","
          - code [ref=e1361]: "`scale-*`"
          - text: ", and"
          - code [ref=e1362]: "`translate-*`"
          - text: utilities are now based on the individual
          - code [ref=e1363]: "`rotate`"
          - text: ","
          - code [ref=e1364]: "`scale`"
          - text: ", and"
          - code [ref=e1365]: "`translate`"
          - text: "properties in CSS. Normally this shouldn't affect the behavior but there's a couple of cases to look out for:"
        - heading [level=4] [ref=e1366]:
          - link "Resetting Transforms" [ref=e1367] [cursor=pointer]:
            - /url: "#resetting-transforms"
        - paragraph [ref=e1368]:
          - text: You previously would've been able to "reset" your rotate, scale, and translate utilities via
          - code [ref=e1369]: "`transform-none`"
          - text: ". This no longer works and you will need to reset the individual properties instead:"
        - generic [ref=e1372]:
          - generic [ref=e1373]: HTML
          - code [ref=e1377]:
            - generic [ref=e1378]: "- <button class=\"scale-150 focus:transform-none\"></button>"
            - generic [ref=e1379]: + <button class="scale-150 focus:scale-none"></button>
        - heading [level=4] [ref=e1380]:
          - link "Transitions" [ref=e1381] [cursor=pointer]:
            - /url: "#transitions"
        - paragraph [ref=e1382]:
          - text: If you customize the list of transitioned properties and include
          - code [ref=e1383]: "`transform`"
          - text: (e.g. by writing
          - code [ref=e1384]: "`transition-[opacity,transform]`"
          - text: ) then these utilities will no longer transition. To fix this, include the individual properties in the list. For example, if you want to transition changes when using
          - code [ref=e1385]: "`opacity-*`"
          - text: and
          - code [ref=e1386]: "`scale-*`"
          - text: utilities you should use
          - code [ref=e1387]: "`transition-[opacity,scale]`"
          - text: instead.
        - generic [ref=e1390]:
          - generic [ref=e1391]: HTML
          - code [ref=e1395]:
            - generic [ref=e1396]: "- <button class=\"transition-[opacity,transform] hover:scale-150\"></button>"
            - generic [ref=e1397]: + <button class="transition-[opacity,scale] hover:scale-150"></button>
        - heading [level=3] [ref=e1398]:
          - link "Disabling core plugins" [ref=e1399] [cursor=pointer]:
