        - paragraph [ref=e1400]:
          - text: In v3 there was a
          - code [ref=e1401]: "`corePlugins`"
          - text: option you could use to completely disable certain utilities in the framework. This is no longer supported in v4.
        - heading [level=3] [ref=e1402]:
          - link "Using the theme() function" [ref=e1403] [cursor=pointer]:
            - /url: "#using-the-theme-function"
        - paragraph [ref=e1404]:
          - text: Since v4 includes CSS variables for all of your theme values, we recommend using those variables instead of the
          - code [ref=e1405]: "`theme()`"
          - text: "function whenever possible:"
        - generic [ref=e1408]:
          - generic [ref=e1409]: CSS
          - code [ref=e1413]:
            - generic [ref=e1414]: ".my-class {"
            - generic [ref=e1415]: "- background-color: theme(colors.red.500);"
            - generic [ref=e1416]: "+ background-color: var(--color-red-500);"
            - generic [ref=e1417]: "}"
        - paragraph [ref=e1418]:
          - text: For cases where you still need to use the
          - code [ref=e1419]: "`theme()`"
          - text: "function (like in media queries where CSS variables aren't supported), you should use the CSS variable name instead of the old dot notation:"
        - generic [ref=e1422]:
          - generic [ref=e1423]: CSS
          - code [ref=e1427]:
            - generic [ref=e1428]: "- @media (width >= theme(screens.xl)) {"
            - generic [ref=e1429]: "+ @media (width >= theme(--breakpoint-xl)) {"
