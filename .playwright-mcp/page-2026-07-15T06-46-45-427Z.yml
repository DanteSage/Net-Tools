        - paragraph [ref=e641]:
          - text: Tailwind CSS v4.0 is designed for modern browsers and targets Safari 16.4, Chrome 111, and Firefox 128. We depend on modern CSS features like
          - code [ref=e642]: "`@property`"
          - text: and
          - code [ref=e643]: "`color-mix()`"
          - text: for core framework features, and Tailwind CSS v4.0 will not work in older browsers.
        - paragraph [ref=e644]: If you need to support older browsers, we recommend sticking with v3.4 for now. We're actively exploring a compatibility mode to help people upgrade sooner that we hope to share more news on in the future.
        - heading [level=3] [ref=e645]:
          - link "Removed @tailwind directives" [ref=e646] [cursor=pointer]:
