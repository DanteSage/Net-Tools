          - text: "library for React lets you animate to and from CSS variable values:"
        - generic [ref=e1461]:
          - generic [ref=e1462]: JSX
          - code [ref=e1466]:
            - generic [ref=e1467]: "<motion.div animate={{ backgroundColor: \" var(--color-blue-500)\" }} />"
        - paragraph [ref=e1468]:
          - text: If you need access to a resolved CSS variable value in JS, you can use
          - code [ref=e1469]: "`getComputedStyle`"
          - text: "to get the value of a theme variable on the document root:"
        - generic [ref=e1472]:
