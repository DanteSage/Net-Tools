          - text: .
        - heading [level=3] [ref=e1258]:
          - link "Variant stacking order" [ref=e1259] [cursor=pointer]:
            - /url: "#variant-stacking-order"
        - paragraph [ref=e1260]: In v3, stacked variants were applied from right to left, but in v4 we've updated them to apply left to right to look more like CSS syntax.
