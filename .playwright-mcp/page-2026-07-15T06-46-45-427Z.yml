            - code [ref=e1451]: "`@source inline()`"
          - text: .
        - heading [level=3] [ref=e1452]:
          - link "Theme values in JavaScript" [ref=e1453] [cursor=pointer]:
            - /url: "#theme-values-in-javascript"
        - paragraph [ref=e1454]:
          - text: In v3 we exported a
          - code [ref=e1455]: "`resolveConfig`"
          - text: function that you could use to turn your JavaScript-based config into a flat object that you could use in your other JavaScript.
        - paragraph [ref=e1456]: We've removed this in v4 in hopes that people can use the CSS variables we generate directly instead, which is much simpler and will significantly reduce your bundle size.
        - paragraph [ref=e1457]:
          - text: For example, the popular
          - link "Motion" [ref=e1458] [cursor=pointer]:
