            - generic [ref=e1503]: "@apply text-2xl font-bold text-red-500;"
            - generic [ref=e1504]: "}"
            - generic [ref=e1505]: </style>
        - paragraph [ref=e1506]:
          - text: Alternatively, you can use your CSS theme variables directly instead of using
          - code [ref=e1507]: "`@apply`"
          - text: "at all, which will also improve performance since Tailwind won't need to process these styles:"
        - generic [ref=e1510]:
