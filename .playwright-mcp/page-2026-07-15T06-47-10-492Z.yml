          - paragraph [ref=f1e749]: We've added a ton of new gradient features in v4.0, so you can pull off even fancier effects without having to write any custom CSS.
          - heading [level=3] [ref=f1e750]:
            - link "Linear gradient angles" [ref=f1e751] [cursor=pointer]:
              - /url: "#linear-gradient-angles"
          - paragraph [ref=f1e752]:
            - text: Linear gradients now support angles as values, so you can use utilities like
            - code [ref=f1e753]: "`bg-linear-45`"
            - text: "to create a gradient on a 45 degree angle:"
          - figure [ref=f1e756]:
