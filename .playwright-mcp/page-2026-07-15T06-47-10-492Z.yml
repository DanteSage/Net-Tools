          - heading [level=2] [ref=f1e107]:
            - link "New high-performance engine" [ref=f1e108] [cursor=pointer]:
              - /url: "#new-high-performance-engine"
          - paragraph [ref=f1e109]: Tailwind CSS v4.0 is a ground-up rewrite of the framework, taking everything we've learned about the architecture over the years and optimizing it to be as fast as possible.
          - paragraph [ref=f1e110]: When benchmarking it on our own projects, we've found full rebuilds to be over 3.5x faster, and incremental builds to be over 8x faster.
          - paragraph [ref=f1e111]:
            - text: Here are the median build times we saw when we benchmarked Tailwind CSS v4.0 against
            - link "Catalyst" [ref=f1e112] [cursor=pointer]:
