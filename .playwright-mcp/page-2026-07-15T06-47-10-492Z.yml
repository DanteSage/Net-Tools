              - generic [ref=f1e245]: "export default defineConfig({"
              - generic [ref=f1e246]: "plugins: ["
              - generic [ref=f1e247]: tailwindcss(),
              - generic [ref=f1e248]: "],"
              - generic [ref=f1e249]: "});"
          - paragraph [ref=f1e250]: Tailwind CSS v4.0 is incredibly fast when used as a PostCSS plugin, but you'll get even better performance using the Vite plugin.
          - heading [level=2] [ref=f1e251]:
            - link "Automatic content detection" [ref=f1e252] [cursor=pointer]:
              - /url: "#automatic-content-detection"
          - paragraph [ref=f1e253]:
            - text: You know how you always had to configure that annoying
            - code [ref=f1e254]: "`content`"
            - text: array in Tailwind CSS v3? In v4.0, we came up with a bunch of heuristics for detecting all of that stuff automatically so you don’t have to configure it at all.
          - paragraph [ref=f1e255]:
            - text: For example, we automatically ignore anything in your
            - code [ref=f1e256]: "`.gitignore`"
            - text: "file to avoid scanning dependencies or generated files that aren’t under version control:"
