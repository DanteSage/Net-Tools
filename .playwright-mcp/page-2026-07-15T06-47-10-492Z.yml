          - separator [ref=f1e141]
          - heading [level=2] [ref=f1e142]:
            - link "Designed for the modern web" [ref=f1e143] [cursor=pointer]:
              - /url: "#designed-for-the-modern-web"
          - paragraph [ref=f1e144]: The platform has evolved a lot since we released Tailwind CSS v3.0, and v4.0 takes full advantage of many of these improvements.
