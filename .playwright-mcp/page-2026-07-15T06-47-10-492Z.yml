                - generic [ref=f1e204]: "export default {"
                - generic [ref=f1e205]: "plugins: [\"@tailwindcss/postcss\"],"
                - generic [ref=f1e206]: "};"
            - generic [ref=f1e209]:
              - generic [ref=f1e210]: 3. Import Tailwind in your CSS
              - code [ref=f1e214]:
                - generic [ref=f1e215]: "@import \"tailwindcss\";"
          - paragraph [ref=f1e216]: "With the improvements we've made to this process for v4.0, Tailwind feels more light-weight than ever:"
          - list [ref=f1e217]:
