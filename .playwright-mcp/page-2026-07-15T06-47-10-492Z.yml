          - paragraph [ref=f1e341]:
            - text: The new CSS-first configuration lets you do just about everything you could do in your
            - code [ref=f1e342]: "`tailwind.config.js`"
            - text: file, including configuring your design tokens, defining custom utilities and variants, and more.
