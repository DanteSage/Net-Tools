          - paragraph [ref=f1e103]:
            - text: For existing projects, we've published a comprehensive
            - link "upgrade guide" [ref=f1e104] [cursor=pointer]:
              - /url: /docs/upgrade-guide
            - text: and built an
            - link "automated upgrade tool" [ref=f1e105] [cursor=pointer]:
