          - paragraph [ref=f1e180]: Many of these features have even simplified Tailwind internally, reducing the surface area for bugs and making the framework easier for us to maintain.
          - separator [ref=f1e181]
          - heading [level=2] [ref=f1e182]:
            - link "Simplified installation" [ref=f1e183] [cursor=pointer]:
              - /url: "#simplified-installation"
          - paragraph [ref=f1e184]: We've streamlined the setup process a ton in v4.0, reducing the number of steps and removing a lot of boilerplate.
