                - cell "182x" [ref=f1e135]
          - paragraph [ref=f1e136]:
            - text: The most impressive improvement is on incremental builds that don't actually need to compile any new CSS — these builds are over 100x faster and complete in
            - emphasis [ref=f1e137]: microseconds
            - text: . And the longer you work on a project, the more of these builds you run into because you're just using classes you've already used before, like
            - code [ref=f1e138]: "`flex`"
            - text: ","
            - code [ref=f1e139]: "`col-span-2`"
            - text: ", or"
