          - paragraph [ref=f1e790]:
            - text: Using polar color spaces like OKLCH or HSL can lead to much more vivid gradients when the
            - code [ref=f1e791]: "`from-*`"
            - text: and
            - code [ref=f1e792]: "`to-*`"
            - text: colors are far apart on the color wheel. We're using OKLAB by default in v4.0 but you can always interpolate using a different color space by adding one of these modifiers.
