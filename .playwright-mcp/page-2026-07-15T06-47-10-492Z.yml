              - /url: /docs/installation/using-vite
              - code [ref=f1e233]: "`@tailwindcss/vite`"
            - text: "instead of PostCSS:"
          - generic [ref=f1e236]:
            - generic [ref=f1e237]: vite.config.ts
            - code [ref=f1e241]:
              - generic [ref=f1e242]: "import { defineConfig } from \"vite\";"
