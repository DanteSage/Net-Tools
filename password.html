<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密码验证 - Net Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 默认深色色板 */
        :root {
            --pwd-bg: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            --pwd-particle: rgba(0, 212, 255, 0.6);
            --pwd-accent-1: #00d4ff;
            --pwd-accent-2: #00ff88;
            --pwd-subtitle: #666;
            --pwd-input-bg: rgba(255, 255, 255, 0.05);
            --pwd-input-border: rgba(255, 255, 255, 0.1);
            --pwd-input-text: #fff;
            --pwd-input-placeholder: #666;
            --pwd-icon: #666;
            --pwd-version: #444;
            --pwd-error: #ff4757;
            --pwd-glow: rgba(0, 212, 255, 0.5);
            --pwd-focus-glow: rgba(0, 212, 255, 0.2);
            --pwd-btn-glow: rgba(0, 212, 255, 0.4);
        }

        /* 浅色色板 */
        body[data-mode="light"] {
            --pwd-bg: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 50%, #dbeafe 100%);
            --pwd-particle: rgba(59, 130, 246, 0.45);
            --pwd-accent-1: #3b82f6;
            --pwd-accent-2: #06b6d4;
            --pwd-subtitle: #64748b;
            --pwd-input-bg: rgba(255, 255, 255, 0.7);
            --pwd-input-border: rgba(59, 130, 246, 0.25);
            --pwd-input-text: #1e293b;
            --pwd-input-placeholder: #94a3b8;
            --pwd-icon: #64748b;
            --pwd-version: #94a3b8;
            --pwd-error: #dc2626;
            --pwd-glow: rgba(59, 130, 246, 0.35);
            --pwd-focus-glow: rgba(59, 130, 246, 0.18);
            --pwd-btn-glow: rgba(59, 130, 246, 0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--pwd-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--pwd-particle);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 6s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 7s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 8s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 0.5s; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .login-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-app-region: no-drag;
        }

        .logo {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 24px;
        }

        .logo-ring {
            position: absolute;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        .logo-ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: var(--pwd-accent-1);
            border-right-color: var(--pwd-accent-1);
        }

        .logo-ring-2 {
            width: 75%;
            height: 75%;
            top: 12.5%;
            left: 12.5%;
            border-bottom-color: var(--pwd-accent-2);
            border-left-color: var(--pwd-accent-2);
            animation-direction: reverse;
            animation-duration: 2s;
        }

        .logo-center {
            position: absolute;
            width: 45%;
            height: 45%;
            top: 27.5%;
            left: 27.5%;
            background: linear-gradient(135deg, var(--pwd-accent-1), var(--pwd-accent-2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--pwd-glow);
        }

        .logo-center svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .app-name {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--pwd-accent-1), var(--pwd-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 13px;
            color: var(--pwd-subtitle);
            margin-bottom: 32px;
        }

        .password-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }

        .input-group svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--pwd-icon);
            pointer-events: none;
        }

        .password-input {
            width: 100%;
            padding: 14px 44px;
            font-size: 15px;
            border: 2px solid var(--pwd-input-border);
            border-radius: 12px;
            background: var(--pwd-input-bg);
            color: var(--pwd-input-text);
            outline: none;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            border-color: var(--pwd-accent-1);
            box-shadow: 0 0 20px var(--pwd-focus-glow);
        }

        .password-input::placeholder { color: var(--pwd-input-placeholder); }

        .password-input.error {
            border-color: var(--pwd-error);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            position: static;
            transform: none;
            fill: var(--pwd-icon);
            transition: fill 0.2s;
        }

        .toggle-password:hover svg { fill: var(--pwd-accent-1); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pwd-accent-1), var(--pwd-accent-2));
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--pwd-btn-glow);
        }

        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-message {
            color: var(--pwd-error);
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }

        .version {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: var(--pwd-version);
        }
    </style>
    <script>
        (function () {
            try {
                var p = new URLSearchParams(window.location.search);
                var mode = p.get('mode') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-mode', mode);
                document.addEventListener('DOMContentLoaded', function () {
                    document.body.setAttribute('data-mode', mode);
                });
            } catch (_) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-ring logo-ring-1"></div>
            <div class="logo-ring logo-ring-2"></div>
            <div class="logo-center">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>
        </div>

        <div class="app-name">Net Tools</div>
        <div class="app-subtitle">请输入启动密码</div>

        <form class="password-form" id="password-form">
            <div class="input-group">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                <input type="password" class="password-input" id="password-input" placeholder="请输入密码" autocomplete="off" autofocus>
                <button type="button" class="toggle-password" id="toggle-password" title="显示/隐藏密码">
                    <svg viewBox="0 0 24 24" width="18" height="18" id="eye-icon">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">解锁</button>
            <div class="error-message" id="error-message"></div>
        </form>
    </div>

    <div class="version">v1.1.5</div>

    <script>
        const form = document.getElementById('password-form');
        const input = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        let isPasswordVisible = false;

        toggleBtn.addEventListener('click', () => {
            isPasswordVisible = !isPasswordVisible;
            input.type = isPasswordVisible ? 'text' : 'password';
            eyeIcon.innerHTML = isPasswordVisible 
                ? '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>'
                : '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = input.value;
            if (!password) {
                showError('请输入密码');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '验证中...';
            errorMsg.textContent = '';
            input.classList.remove('error');

            try {
                const result = await window.passwordApi.verify(password);
                if (result.success) {
                    window.passwordApi.unlockSuccess();
                } else {
                    showError(result.error || '密码错误');
                    input.classList.add('error');
                    input.select();
                }
            } catch (err) {
                showError('验证失败: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '解锁';
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            input.classList.add('error');
            setTimeout(() => input.classList.remove('error'), 500);
        }

        input.addEventListener('input', () => {
            errorMsg.textContent = '';
            input.classList.remove('error');
        });
    </script>
</body>
</html>
