            --border-color: var(--border-color, rgba(0, 0, 0, 0.08));
            --card-bg: var(--bg-card, #ffffff);

            --input-bg: var(--bg-primary, #ffffff);
            --input-border: var(--border-light, #cbd5e1);
            --result-bg: var(--bg-secondary, #f1f5f9);
            --primary: var(--primary-color, #2563eb);

    <script>
        // ==================== IPv6 HELPERS ====================
        // Parses IPv6 to 8 blocks of 16-bit integers
        function parseIpv6(ipStr) {
            ipStr = ipStr.trim().toLowerCase();
            const doubleColonIdx = ipStr.indexOf('::');
            
            if (doubleColonIdx !== -1) {
                const leftPart = ipStr.substring(0, doubleColonIdx).split(':').filter(Boolean);
                const rightPart = ipStr.substring(doubleColonIdx + 2).split(':').filter(Boolean);
                
                const leftCount = leftPart.length;
                const rightCount = rightPart.length;
                const missingCount = 8 - (leftCount + rightCount);
                if (missingCount < 0) return null;
                
                const blocks = [];
                for (let i = 0; i < leftCount; i++) {
                    const val = parseInt(leftPart[i], 16);
                    if (isNaN(val) || val < 0 || val > 0xFFFF) return null;
                    blocks.push(val);
                }
                for (let i = 0; i < missingCount; i++) {
                    blocks.push(0);
                }
                for (let i = 0; i < rightCount; i++) {
                    const val = parseInt(rightPart[i], 16);
                    if (isNaN(val) || val < 0 || val > 0xFFFF) return null;
                    blocks.push(val);
                }
                return blocks;
            } else {
                const parts = ipStr.split(':');
                if (parts.length !== 8) return null;
                const blocks = [];
                for (let i = 0; i < 8; i++) {
                    const val = parseInt(parts[i], 16);
                    if (isNaN(val) || val < 0 || val > 0xFFFF) return null;
                    blocks.push(val);
                }
                return blocks;
            }
        }

        // Expands blocks to fully padded format (RFC 5952 non-compressed)
        function expandIpv6(blocks) {
            return blocks.map(b => b.toString(16).padStart(4, '0')).join(':');
        }

        // Compresses blocks to standard compressed form (RFC 5952)
        function compressIpv6(blocks) {
            const hexList = blocks.map(b => b.toString(16));
            
            let bestStart = -1;
            let bestLen = 0;
            let curStart = -1;
            let curLen = 0;
            
            for (let i = 0; i < 8; i++) {
                if (blocks[i] === 0) {
                    if (curLen === 0) {
                        curStart = i;
                    }
                    curLen++;
                } else {
                    if (curLen > bestLen) {
                        bestStart = curStart;
                        bestLen = curLen;
                    }
                    curLen = 0;
                }
            }
            if (curLen > bestLen) {
                bestStart = curStart;
                bestLen = curLen;
            }
            
            if (bestLen > 1) {
                const left = hexList.slice(0, bestStart).join(':');
                const right = hexList.slice(bestStart + bestLen).join(':');
                return left + '::' + right;
            }
            
            return hexList.join(':');
        }

        // Calculate start and end IP block ranges
        function getSubnetRange(blocks, prefix) {
            const start = [];
            const end = [];
            
            for (let i = 0; i < 8; i++) {
                const startBit = i * 16;
                if (prefix >= (i + 1) * 16) {
                    start.push(blocks[i]);
                    end.push(blocks[i]);
                } else if (prefix <= startBit) {
                    start.push(0);
                    end.push(0xFFFF);
                } else {
                    const k = prefix - startBit;
                    const mask = (0xFFFF << (16 - k)) & 0xFFFF;
                    const startVal = blocks[i] & mask;
                    start.push(startVal);
                    end.push(startVal | (~mask & 0xFFFF));
                }
            }
            return { start, end };
        }

        // Helper to format BigInt with commas
        function formatBigInt(val) {
            const str = val.toString();
            return str.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // ==================== TABS SWITCHING ====================
        const tabs = document.querySelectorAll('.tab-item');
        const panels = document.querySelectorAll('.tab-panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                const target = document.getElementById(tab.dataset.target);
                if (target) target.classList.add('active');
            });
        });

        // ==================== TOAST MSG ====================
        const toast = document.getElementById('toast');
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        // ==================== TAB 1: 子网计算 ====================
        const calcIpInput = document.getElementById('calc-ip-input');
        const btnCalcRun = document.getElementById('btn-calc-run');
        const calcFormatRadios = document.querySelectorAll('input[name="calc-format"]');

        const calcResRange = document.getElementById('calc-res-range');
        const calcResFirst = document.getElementById('calc-res-first');
        const calcResLast = document.getElementById('calc-res-last');
        const calcResCount = document.getElementById('calc-res-count');

        let calcLastResult = null; // Store last calculated range

        btnCalcRun.addEventListener('click', calculateTab1);
        calcIpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculateTab1();
        });

        function calculateTab1() {
            const val = calcIpInput.value.trim();
            if (!val) {
                showToast("请输入 IPv6 地址");
                return;
            }

            let ipStr = val;
            let prefix = 64;
            if (val.includes('/')) {
                const parts = val.split('/');
                ipStr = parts[0];
                prefix = parseInt(parts[1]);
                if (isNaN(prefix) || prefix < 1 || prefix > 128) {
                    showToast("前缀长度范围应为 1-128");
                    return;
                }
            }

            const blocks = parseIpv6(ipStr);
            if (!blocks) {
                showToast("IPv6 地址格式不正确");
                return;
            }

            const { start, end } = getSubnetRange(blocks, prefix);
            const count = BigInt(2) ** BigInt(128 - prefix);

            calcLastResult = { start, end, count };
            renderTab1Result();
        }

        function renderTab1Result() {
            if (!calcLastResult) return;
            const format = document.querySelector('input[name="calc-format"]:checked').value;
            const formatFn = format === 'expanded' ? expandIpv6 : compressIpv6;

            const startStr = formatFn(calcLastResult.start);
            const endStr = formatFn(calcLastResult.end);

            calcResRange.textContent = `${startStr} - ${endStr}`;
            calcResFirst.textContent = startStr;
            calcResLast.textContent = endStr;
            calcResCount.textContent = formatBigInt(calcLastResult.count);
        }

        calcFormatRadios.forEach(radio => {
            radio.addEventListener('change', renderTab1Result);
        });


        // ==================== TAB 2: 子网划分 ====================
        const divideIpInput = document.getElementById('divide-ip-input');
        const btnDivideRun = document.getElementById('btn-divide-run');
        const divideFormatRadios = document.querySelectorAll('input[name="divide-format"]');

        const divideResRange = document.getElementById('divide-res-range');
        const divideResFirst = document.getElementById('divide-res-first');
        const divideResLast = document.getElementById('divide-res-last');
        const divideResCount = document.getElementById('divide-res-count');

        let divideLastResult = null;

        btnDivideRun.addEventListener('click', calculateTab2);
        divideIpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculateTab2();
        });

        function calculateTab2() {
            const val = divideIpInput.value.trim();
            if (!val) {
                showToast("请输入 IPv6 地址");
                return;
            }

            let ipStr = val;
            let prefix = 64;
            if (val.includes('/')) {
                const parts = val.split('/');
                ipStr = parts[0];
                prefix = parseInt(parts[1]);
                if (isNaN(prefix) || prefix < 1 || prefix > 128) {
                    showToast("前缀长度范围应为 1-128");
                    return;
                }
            }

            const blocks = parseIpv6(ipStr);
            if (!blocks) {
                showToast("IPv6 地址格式不正确");
                return;
            }

            const { start, end } = getSubnetRange(blocks, prefix);
            const count = BigInt(2) ** BigInt(128 - prefix);

            divideLastResult = { start, end, count };
            renderTab2Result();
        }

        function renderTab2Result() {
            if (!divideLastResult) return;
            const format = document.querySelector('input[name="divide-format"]:checked').value;
            const formatFn = format === 'expanded' ? expandIpv6 : compressIpv6;

            const startStr = formatFn(divideLastResult.start);
            const endStr = formatFn(divideLastResult.end);

            divideResRange.textContent = `${startStr} - ${endStr}`;
            divideResFirst.textContent = startStr;
            divideResLast.textContent = endStr;
            divideResCount.textContent = formatBigInt(divideLastResult.count);
        }

        divideFormatRadios.forEach(radio => {
            radio.addEventListener('change', renderTab2Result);
        });


        // ==================== TAB 3: 子网聚合 ====================
        const aggInputsContainer = document.getElementById('agg-inputs-container');
        const aggFormatRadios = document.querySelectorAll('input[name="agg-format"]');

        const aggResIp = document.getElementById('agg-res-ip');
        const aggResRange = document.getElementById('agg-res-range');
        const aggResFirst = document.getElementById('agg-res-first');
        const aggResLast = document.getElementById('agg-res-last');
        const aggResCount = document.getElementById('agg-res-count');

        let aggSubnetList = ["", ""];
        let aggLastResult = null;

        function renderAggRows() {
            let html = '';
            const N = aggSubnetList.length;
            aggSubnetList.forEach((val, idx) => {
                const itemNum = idx + 1;
                
                let buttonGroupHtml = '';
                if (idx === 0) {
                    // Row 1: only input
                    buttonGroupHtml = `<input type="text" class="form-input code-font agg-ip-input" placeholder="请输入IPv6地址和前缀(1-128)，比如2001:0a11::/64或2001:0A11:0000:0000:0000:0000:0000:0000/64" value="${val}">`;
                } else if (idx === 1 && N === 2) {
                    // Row 2 when N = 2: input + (+) + 计算
                    buttonGroupHtml = `
                        <div class="input-btn-group">
                            <input type="text" class="form-input code-font agg-ip-input" placeholder="请输入IPv6地址和前缀(1-128)，比如2001:0a11::/64或2001:0A11:0000:0000:0000:0000:0000:0000/64" value="${val}">
                            <button class="btn btn-icon-only btn-secondary" title="添加子网" onclick="addAggInputRow()">
                                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            </button>
                            <button class="btn btn-primary" onclick="calculateSupernet()">计算</button>
                        </div>
                    `;
                } else if (idx === 1 && N > 2) {
                    // Row 2 when N > 2: only input
                    buttonGroupHtml = `<input type="text" class="form-input code-font agg-ip-input" placeholder="请输入IPv6地址和前缀(1-128)，比如2001:0a11::/64或2001:0A11:0000:0000:0000:0000:0000:0000/64" value="${val}">`;
                } else if (idx > 1 && idx < N - 1) {
                    // Middle optional rows: input + (-)
                    buttonGroupHtml = `
                        <div class="input-btn-group">
                            <input type="text" class="form-input code-font agg-ip-input" placeholder="请输入IPv6地址和前缀(1-128)，比如2001:0a11::/64或2001:0A11:0000:0000:0000:0000:0000:0000/64" value="${val}">
                            <button class="btn btn-icon-only btn-danger" title="删除" onclick="removeAggInputRow(${idx})">
                                <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                            </button>
                        </div>
                    `;
                } else if (idx === N - 1) {
                    // The last row when N > 2: input + (+) + (-) + 计算
                    buttonGroupHtml = `
                        <div class="input-btn-group">
                            <input type="text" class="form-input code-font agg-ip-input" placeholder="请输入IPv6地址和前缀(1-128)，比如2001:0a11::/64或2001:0A11:0000:0000:0000:0000:0000:0000/64" value="${val}">
                            <button class="btn btn-icon-only btn-secondary" title="添加子网" onclick="addAggInputRow()">
                                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            </button>
                            <button class="btn btn-icon-only btn-danger" title="删除" onclick="removeAggInputRow(${idx})">
                                <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                            </button>
                            <button class="btn btn-primary" onclick="calculateSupernet()">计算</button>
                        </div>
                    `;
                }

                html += `
                    <div class="form-item horizontal agg-row" data-index="${idx}">
                        <label class="form-label-horizontal">子网${itemNum}：</label>
                        ${buttonGroupHtml}
                    </div>
                `;
            });
            aggInputsContainer.innerHTML = html;

            // Bind updates
            const inputs = aggInputsContainer.querySelectorAll('.agg-ip-input');
            inputs.forEach(input => {
                input.addEventListener('change', (e) => {
                    const rowIdx = parseInt(e.target.closest('.agg-row').dataset.index);
                    aggSubnetList[rowIdx] = e.target.value;
                });
            });
        }

        window.addAggInputRow = function() {
            const inputs = aggInputsContainer.querySelectorAll('.agg-ip-input');
            inputs.forEach((inp, idx) => {
                aggSubnetList[idx] = inp.value;
            });
            aggSubnetList.push("");
            renderAggRows();
        };

        window.removeAggInputRow = function(idx) {
            const inputs = aggInputsContainer.querySelectorAll('.agg-ip-input');
            inputs.forEach((inp, i) => {
                aggSubnetList[i] = inp.value;
            });
            aggSubnetList.splice(idx, 1);
            renderAggRows();
        };

        function getCommonPrefixLength(ipA, ipB) {
            let prefix = 0;
            for (let i = 0; i < 8; i++) {
                const diff = ipA[i] ^ ipB[i];
                if (diff === 0) {
                    prefix += 16;
                } else {
                    const leadingZeros = Math.clz32(diff) - 16;
                    prefix += leadingZeros;
                    break;
                }
            }
            return prefix;
        }

        window.calculateSupernet = function() {
            const inputs = aggInputsContainer.querySelectorAll('.agg-ip-input');
            const subnets = [];
            let hasInvalid = false;

            inputs.forEach((inp, idx) => {
                const val = inp.value.trim();
                aggSubnetList[idx] = val;
                if (!val) return;

                let ipStr = val;
                let prefix = 128;
                if (val.includes('/')) {
                    const parts = val.split('/');
                    ipStr = parts[0];
                    prefix = parseInt(parts[1]);
                    if (isNaN(prefix) || prefix < 1 || prefix > 128) {
                        hasInvalid = true;
                        showToast(`子网 ${idx + 1} 的前缀不正确`);
                    }
                }

                const blocks = parseIpv6(ipStr);
                if (!blocks) {
                    hasInvalid = true;
                    showToast(`子网 ${idx + 1} 的 IPv6 地址不正确`);
                }

                if (!hasInvalid) {
                    const { start, end } = getSubnetRange(blocks, prefix);
                    subnets.push({ start, end });
                }
            });

            if (hasInvalid) return;
            if (subnets.length === 0) {
                showToast("请输入子网网段");
                return;
            }

            // Find min and max bounds for LCP
            // Let's implement block comparison
            const compareBlocks = (a, b) => {
                for (let i = 0; i < 8; i++) {
                    if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
                }
                return 0;
            };

            let globalMin = subnets[0].start;
            let globalMax = subnets[0].end;

            for (let i = 1; i < subnets.length; i++) {
                if (compareBlocks(subnets[i].start, globalMin) < 0) {
                    globalMin = subnets[i].start;
                }
                if (compareBlocks(subnets[i].end, globalMax) > 0) {
                    globalMax = subnets[i].end;
                }
            }

            const supernetPrefix = getCommonPrefixLength(globalMin, globalMax);
            const { start: supernetStart, end: supernetEnd } = getSubnetRange(globalMin, supernetPrefix);
            const count = BigInt(2) ** BigInt(128 - supernetPrefix);

            aggLastResult = {
                prefix: supernetPrefix,
                net: supernetStart,
                start: supernetStart,
                end: supernetEnd,
                count: count
            };

            renderAggResult();
        };

        function renderAggResult() {
            if (!aggLastResult) return;
            const format = document.querySelector('input[name="agg-format"]:checked').value;
            const formatFn = format === 'expanded' ? expandIpv6 : compressIpv6;

            const netStr = formatFn(aggLastResult.net);
            const startStr = formatFn(aggLastResult.start);
            const endStr = formatFn(aggLastResult.end);

            aggResIp.textContent = `${netStr}/${aggLastResult.prefix}`;
            aggResRange.textContent = `${startStr} - ${endStr}`;
            aggResFirst.textContent = startStr;
            aggResLast.textContent = endStr;
            aggResCount.textContent = formatBigInt(aggLastResult.count);
        }

        aggFormatRadios.forEach(radio => {
            radio.addEventListener('change', renderAggResult);
        });


        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            calculateTab1();
            renderAggRows();

            // IPC Theme Synchronizer
            try {
                const { ipcRenderer } = require('electron');
                function applyTheme(theme) {
                    if (!theme) return;
                    document.documentElement.setAttribute('data-theme', theme.mode || 'dark');
                    document.documentElement.setAttribute('data-theme-name', theme.key || 'one-dark');
                    if (theme.mode === 'light') {
                        document.documentElement.classList.add('light-theme');
                    } else {
                        document.documentElement.classList.remove('light-theme');
                    }
                }
                
                // Initial load sync
                const _qs = new URLSearchParams(location.search);
                const _qsMode = _qs.get('mode');
                const _qsTheme = _qs.get('theme');
                if (_qsMode || _qsTheme) {
                    applyTheme({ mode: _qsMode, key: _qsTheme });
                } else {
                    ipcRenderer.invoke('theme:get').then(theme => {
                        applyTheme(theme);
                    }).catch(() => {});
                }

                ipcRenderer.on('theme:changed', (event, theme) => {
                    applyTheme(theme);
                });
            } catch(e) {}
        });
    </script>
</body>
</html>
